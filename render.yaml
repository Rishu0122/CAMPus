services:
  - type: web
    name: campus-community
    env: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CAMPUS_SECRET
        generateValue: true
      - key: DB_PATH
        value: /opt/render/project/src/data/campus.db
      - key: APP_URL
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: ADMIN_SETUP_KEY
        sync: false
    disk:
      name: campus-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
